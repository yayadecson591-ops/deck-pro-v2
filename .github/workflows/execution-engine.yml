name: Deck Pro execution and decision flow

on:
  push:
    paths:
      - 'server/execution.js'
      - 'server/execution-engine.js'
      - 'server/execution-adapters.js'
      - 'server/execution-engine.test.js'
      - 'server/decision-engine.js'
      - 'server/decision-engine.test.js'
      - 'server/radar-decision-execution.integration.test.js'
      - 'server/package.json'
  pull_request:
    paths:
      - 'server/execution.js'
      - 'server/execution-engine.js'
      - 'server/execution-adapters.js'
      - 'server/execution-engine.test.js'
      - 'server/decision-engine.js'
      - 'server/decision-engine.test.js'
      - 'server/radar-decision-execution.integration.test.js'
      - 'server/package.json'

jobs:
  execution-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:execution
      - run: npm run test:decision
