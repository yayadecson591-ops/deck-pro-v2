services:
  - type: web
    name: deck-pro-web
    runtime: static
    buildCommand: mkdir -p public && cp index.html public/index.html
    staticPublishPath: ./public
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  - type: web
    name: deck-pro-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /tmp/deck-pro-data
      - key: ODDSPAPI_API_KEY
        sync: false
      - key: OWNER_CODE_SALT
        generateValue: true
      - key: OWNER_CODE_HASH
        sync: false
      - key: OWNER_TOKEN_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://deck-pro-web.onrender.com
      - key: BOOKMAKERS
        value: sportybet,betmomo,premierbet,betpawa.cm,1xbet,1xwin,afropari
