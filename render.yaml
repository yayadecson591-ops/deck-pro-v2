databases:
  - name: deck-pro-db
    plan: free
    region: frankfurt
    version: 18

services:
  - type: web
    name: deck-pro-web
    runtime: static
    buildCommand: mkdir -p public && cp index.html app.js sw.js manifest.webmanifest public/ 2>/dev/null; true
    staticPublishPath: ./public
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  - type: web
    name: deck-pro-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /tmp/deck-pro-data
      - key: DATABASE_URL
        fromDatabase:
          name: deck-pro-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
